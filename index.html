<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <!-- B-004: full-screen / home-screen capable -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chalé" />
    <meta name="theme-color" content="#090d16" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/chale-life/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/chale-life/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/chale-life/icons/icon-192.png" />
    <title>Chalé Life</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090d16;
        font-family: system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
      }
      html {
        position: fixed;
        inset: 0;
      }
      body {
        position: fixed;
        inset: 0;
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
