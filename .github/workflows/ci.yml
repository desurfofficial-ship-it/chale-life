name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit + perf tests run BEFORE build (fail fast, keep builds honest).
      - run: npm run test
      - run: npm run checks
      - run: npm run build
      - run: npm run lint
