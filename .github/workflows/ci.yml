name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # S-001: secret scan over the FULL git history (every commit reachable
  # from the merge head). Fails on any finding not listed in
  # .gitleaksignore — new secrets break CI, the known pre-existing hit is
  # documented there and in the S-001 PR. Pinned version, --redact so
  # secret values never reach the CI log.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned v8.30.1)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Secret scan (full history, fail on findings)
        run: ./gitleaks git --redact -v .
  typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit + perf tests run BEFORE build (fail fast, keep builds honest).
      - run: npm run test
      - run: npm run checks
      - run: npm run build
      - run: npm run lint
      # E-005 robot playtest: the BUILT app driven end-to-end under Chromium
      # with software WebGL (SwiftShader) at 390x844. Runs LAST — after the
      # typecheck → test → checks → build gates it exists to protect.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-playtest-screenshots
          path: test-results/**/*.png
          if-no-files-found: warn
